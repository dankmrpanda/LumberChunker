[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumberchunker"
version = "0.1.0"
description = "LLM-powered semantic document segmentation for long-form narrative documents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "André V. Duarte" },
    { name = "João D.S. Marques" },
    { name = "Miguel Graça" },
    { name = "Miguel Freire" },
    { name = "Lei Li" },
    { name = "Arlindo L. Oliveira" },
]
keywords = [
    "chunking",
    "document-segmentation",
    "llm",
    "nlp",
    "rag",
    "retrieval-augmented-generation",
    "text-segmentation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "google-genai>=1.0.0",
    "openai>=2.0.0",
    "anthropic>=0.40.0",
    "ollama>=0.4.0",
    "tqdm>=4.60.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/LumberChunker/LumberChunker"
Documentation = "https://github.com/LumberChunker/LumberChunker#readme"
Repository = "https://github.com/LumberChunker/LumberChunker"
"Bug Tracker" = "https://github.com/LumberChunker/LumberChunker/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lumberchunker"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
